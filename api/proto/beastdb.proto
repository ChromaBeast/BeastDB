syntax = "proto3";

package beastdb.v1;

option go_package = "github.com/ChromaBeast/beastdb/api/proto;beastv1";

// BeastDBService exposes client database operations over high-performance gRPC.
service BeastDBService {
  rpc Get (GetRequest) returns (GetResponse);
  rpc Put (PutRequest) returns (PutResponse);
  rpc Delete (DeleteRequest) returns (DeleteResponse);
  rpc Scan (ScanRequest) returns (stream KeyValueResponse);
  rpc BatchWrite (BatchWriteRequest) returns (BatchWriteResponse);
}

// ReplicationService handles physical WAL streaming from Leader to Followers.
service ReplicationService {
  rpc StreamWAL (StreamWALRequest) returns (stream WALRecordMessage);
  rpc Ack (ReplicationAck) returns (AckResponse);
  // Fence freezes a leader's writes at a new epoch and reports its final LSN.
  rpc Fence (FenceRequest) returns (FenceResponse);
}

message GetRequest {
  uint64 key = 1;
}

message GetResponse {
  uint64 key = 1;
  bytes value = 2;
  bool found = 3;
}

message PutRequest {
  uint64 key = 1;
  bytes value = 2;
  // Optional precondition on the key's current state, checked atomically with the write.
  Condition condition = 3;
}

message PutResponse {
  bool success = 1;
}

message DeleteRequest {
  uint64 key = 1;
  // Optional precondition on the key's current state, checked atomically with the delete.
  Condition condition = 2;
}

message DeleteResponse {
  bool success = 1;
}

message ScanRequest {
  uint64 start_key = 1;
  uint64 end_key = 2;
  // Maximum records to return; 0 means no limit. To resume a limited scan,
  // pass last returned key + 1 as start_key.
  uint32 limit = 3;
}

message KeyValueResponse {
  uint64 key = 1;
  bytes value = 2;
}

message StreamWALRequest {
  string replica_id = 1;
  uint64 from_lsn = 2;
  // Highest leader epoch the follower has seen. A leader that sees a higher
  // epoch than its own steps down instead of serving.
  uint64 epoch = 3;
}

message WALRecordMessage {
  uint64 lsn = 1;
  uint32 op_type = 2;
  bytes key = 3;
  bytes value = 4;
  // Epoch of the leader that produced this record; followers reject lower
  // epochs than their own.
  uint64 epoch = 5;
}

message ReplicationAck {
  string replica_id = 1;
  uint64 acknowledged_lsn = 2;
  uint64 epoch = 3;
}

message AckResponse {
  bool success = 1;
  // The leader's epoch and current LSN, so an idle follower can tell whether it is caught up.
  uint64 epoch = 2;
  uint64 leader_lsn = 3;
}

message FenceRequest {
  // New epoch the candidate will lead at; must exceed the leader's epoch.
  uint64 epoch = 1;
  // Replica asking to be promoted. Only one candidate can fence a given epoch.
  string candidate_id = 2;
}

message FenceResponse {
  // Final LSN of the fenced leader: it accepts no writes beyond this.
  uint64 final_lsn = 1;
  uint64 epoch = 2;
}

enum BatchOpType {
  BATCH_OP_TYPE_UNSPECIFIED = 0;
  BATCH_OP_TYPE_PUT = 1;
  BATCH_OP_TYPE_DELETE = 2;
}

message BatchOperation {
  BatchOpType op_type = 1;
  uint64 key = 2;
  bytes value = 3;
}

message BatchWriteRequest {
  repeated BatchOperation operations = 1;
  // Preconditions evaluated before any operation applies; if any fails the
  // whole batch is rejected with ABORTED and nothing is written.
  repeated KeyCondition conditions = 2;
}

message BatchWriteResponse {
  bool success = 1;
  uint32 applied_count = 2;
}

// ConditionKind selects the check a conditional write applies to a key.
enum ConditionKind {
  CONDITION_KIND_NONE = 0;          // no check
  CONDITION_KIND_ABSENT = 1;        // key must not exist
  CONDITION_KIND_PRESENT = 2;       // key must exist
  CONDITION_KIND_VALUE_EQUALS = 3;  // key must exist with exactly `value`
}

message Condition {
  ConditionKind kind = 1;
  bytes value = 2;  // used by CONDITION_KIND_VALUE_EQUALS
}

message KeyCondition {
  uint64 key = 1;
  Condition condition = 2;
}
