syntax = "proto3";

package beastdb.v1;

option go_package = "github.com/ChromaBeast/beastdb/api/proto;beastv1";

// BeastDBService exposes client database operations over high-performance gRPC.
service BeastDBService {
  rpc Get (GetRequest) returns (GetResponse);
  rpc Put (PutRequest) returns (PutResponse);
  rpc Delete (DeleteRequest) returns (DeleteResponse);
  rpc Scan (ScanRequest) returns (stream KeyValueResponse);
  rpc BatchWrite (BatchWriteRequest) returns (BatchWriteResponse);
  // Collections bind a name to an 8-bit key prefix (docs/adr/0002-collections.md).
  // Keys stay uint64: a collection's keys are prefix<<56 | local (local < 2^56).
  rpc CreateCollection (CreateCollectionRequest) returns (CreateCollectionResponse);
  rpc ListCollections (ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc DropCollection (DropCollectionRequest) returns (DropCollectionResponse);
  // Single-field secondary indexes over JSON records (docs/adr/0005-secondary-indexes.md).
  rpc CreateIndex (CreateIndexRequest) returns (CreateIndexResponse);
  rpc ListIndexes (ListIndexesRequest) returns (ListIndexesResponse);
  rpc DropIndex (DropIndexRequest) returns (DropIndexResponse);
}

// ReplicationService handles physical WAL streaming from Leader to Followers.
service ReplicationService {
  rpc StreamWAL (StreamWALRequest) returns (stream WALRecordMessage);
  rpc Ack (ReplicationAck) returns (AckResponse);
  // Fence freezes a leader's writes at a new epoch and reports its final LSN.
  rpc Fence (FenceRequest) returns (FenceResponse);
  // LogEpochs reports where each leader epoch began in the node's log, so a
  // fenced former leader can check that its log is a prefix of this one.
  rpc LogEpochs (LogEpochsRequest) returns (LogEpochsResponse);
}

message GetRequest {
  uint64 key = 1;
}

message GetResponse {
  uint64 key = 1;
  bytes value = 2;
  bool found = 3;
}

message PutRequest {
  uint64 key = 1;
  bytes value = 2;
  // Optional precondition on the key's current state, checked atomically with the write.
  Condition condition = 3;
}

message PutResponse {
  bool success = 1;
}

message DeleteRequest {
  uint64 key = 1;
  // Optional precondition on the key's current state, checked atomically with the delete.
  Condition condition = 2;
}

message DeleteResponse {
  bool success = 1;
}

message ScanRequest {
  uint64 start_key = 1;
  uint64 end_key = 2;
  // Maximum records to return; 0 means no limit. To resume a limited scan,
  // pass last returned key + 1 as start_key.
  uint32 limit = 3;
  // Optional: return only records matching an index, in ascending key order
  // within [start_key, end_key] (ADR 0005). Fails with FAILED_PRECONDITION
  // while the index is building; it never falls back to a full scan. With a
  // filter, end_key 0 means no upper bound.
  IndexFilter filter = 4;
}

// IndexValue is a typed value for an index filter.
message IndexValue {
  oneof value {
    int64 int_value = 1;
    string string_value = 2;
  }
}

// IndexFilter selects by equality (eq) or by an inclusive range (gte and/or
// lte). eq excludes gte and lte. Values must have the index's type.
message IndexFilter {
  string index = 1;
  IndexValue eq = 2;
  IndexValue gte = 3;
  IndexValue lte = 4;
}

enum IndexType {
  INDEX_TYPE_UNSPECIFIED = 0;
  INDEX_TYPE_INT = 1;
  INDEX_TYPE_STRING = 2;
}

message IndexInfo {
  string name = 1;
  string collection = 2;  // empty if the prefix is no longer bound to a name
  uint32 prefix = 3;
  string field = 4;       // dotted JSON object path
  IndexType type = 5;
  string state = 6;       // "building" or "ready"
  uint64 entries = 7;     // records currently indexed
  uint64 skipped = 8;     // records in the collection not indexable (not JSON, field missing or wrong type)
  uint64 examined = 9;    // records examined by the background build
  int64 created_at = 10;
}

message CreateIndexRequest {
  string name = 1;
  string collection = 2;
  string field = 3;
  IndexType type = 4;
}

message CreateIndexResponse {
  IndexInfo index = 1;
}

message ListIndexesRequest {}

message ListIndexesResponse {
  repeated IndexInfo indexes = 1;
}

message DropIndexRequest {
  string name = 1;
}

message DropIndexResponse {
  bool success = 1;
}

message KeyValueResponse {
  uint64 key = 1;
  bytes value = 2;
}

message StreamWALRequest {
  string replica_id = 1;
  uint64 from_lsn = 2;
  // Highest leader epoch the follower has seen. A leader that sees a higher
  // epoch than its own steps down instead of serving.
  uint64 epoch = 3;
  // Epoch of the follower's last logged record (from the OpEpoch markers in its
  // WAL), 0 if unknown. The leader refuses a follower whose last record is at
  // an epoch the leader's log does not have at that LSN (diverged history).
  uint64 last_log_epoch = 4;
}

message WALRecordMessage {
  uint64 lsn = 1;
  uint32 op_type = 2;
  bytes key = 3;
  bytes value = 4;
  // Epoch of the leader that produced this record; followers reject lower
  // epochs than their own.
  uint64 epoch = 5;
}

message ReplicationAck {
  string replica_id = 1;
  uint64 acknowledged_lsn = 2;
  uint64 epoch = 3;
}

message AckResponse {
  bool success = 1;
  // The leader's epoch and current LSN, so an idle follower can tell whether it is caught up.
  uint64 epoch = 2;
  uint64 leader_lsn = 3;
}

message FenceRequest {
  // New epoch the candidate will lead at; must exceed the leader's epoch.
  uint64 epoch = 1;
  // Replica asking to be promoted. Only one candidate can fence a given epoch.
  string candidate_id = 2;
}

message FenceResponse {
  // Final LSN of the fenced leader: it accepts no writes beyond this.
  uint64 final_lsn = 1;
  uint64 epoch = 2;
}

enum BatchOpType {
  BATCH_OP_TYPE_UNSPECIFIED = 0;
  BATCH_OP_TYPE_PUT = 1;
  BATCH_OP_TYPE_DELETE = 2;
}

message BatchOperation {
  BatchOpType op_type = 1;
  uint64 key = 2;
  bytes value = 3;
}

message BatchWriteRequest {
  repeated BatchOperation operations = 1;
  // Preconditions evaluated before any operation applies; if any fails the
  // whole batch is rejected with ABORTED and nothing is written.
  repeated KeyCondition conditions = 2;
}

message BatchWriteResponse {
  bool success = 1;
  uint32 applied_count = 2;
}

// ConditionKind selects the check a conditional write applies to a key.
enum ConditionKind {
  CONDITION_KIND_NONE = 0;          // no check
  CONDITION_KIND_ABSENT = 1;        // key must not exist
  CONDITION_KIND_PRESENT = 2;       // key must exist
  CONDITION_KIND_VALUE_EQUALS = 3;  // key must exist with exactly `value`
}

message Condition {
  ConditionKind kind = 1;
  bytes value = 2;  // used by CONDITION_KIND_VALUE_EQUALS
}

message KeyCondition {
  uint64 key = 1;
  Condition condition = 2;
}

message Collection {
  string name = 1;
  uint32 prefix = 2;       // 0-255; the top 8 bits of every key in the collection
  int64 created_at = 3;    // unix seconds
}

message CreateCollectionRequest {
  string name = 1;         // 1-64 chars of [a-z0-9_-], starting with a letter or digit
  // Explicit prefix (adopts existing records under it). Leave unset to
  // auto-allocate the lowest empty prefix in 0x10-0xFE.
  optional uint32 prefix = 2;
}

message CreateCollectionResponse {
  Collection collection = 1;
}

message ListCollectionsRequest {}

message ListCollectionsResponse {
  repeated Collection collections = 1;
}

message DropCollectionRequest {
  string name = 1;         // refused with FAILED_PRECONDITION while the prefix holds records
}

message DropCollectionResponse {
  bool success = 1;
}

message LogEpochsRequest {
  string replica_id = 1;
  // Highest epoch the caller has seen; a leader behind it steps down.
  uint64 epoch = 2;
}

message EpochStart {
  uint64 lsn = 1;
  uint64 epoch = 2;
}

message LogEpochsResponse {
  uint64 epoch = 1;
  uint64 last_lsn = 2;
  repeated EpochStart epoch_starts = 3;
  string role = 4;
}
