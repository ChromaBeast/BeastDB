<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeastDB — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0f1117;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: #e2e8f0;
    }
    .card {
      background: #1a1d2e;
      border: 1px solid #2d3150;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.6);
    }
    .logo { font-size: 2rem; font-weight: 700; color: #7c3aed; margin-bottom: 0.25rem; }
    .subtitle { font-size: 0.75rem; color: #64748b; margin-bottom: 2rem; letter-spacing: 0.05em; }
    label { display: block; font-size: 0.7rem; color: #94a3b8; text-transform: uppercase;
            letter-spacing: 0.1em; margin-bottom: 0.4rem; }
    input {
      width: 100%; padding: 0.65rem 0.9rem;
      background: #0f1117; border: 1px solid #2d3150; border-radius: 6px;
      color: #e2e8f0; font-family: inherit; font-size: 0.9rem;
      margin-bottom: 1.25rem; transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #7c3aed; }
    .btn {
      width: 100%; padding: 0.75rem;
      background: #7c3aed; color: #fff; border: none; border-radius: 6px;
      font-family: inherit; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    .btn:hover { background: #6d28d9; }
    .error { color: #f87171; font-size: 0.8rem; margin-top: 1rem; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">⚡ BeastDB</div>
    <div class="subtitle">ADMIN CONSOLE · SECURE LOGIN</div>
    <form method="POST" action="/login" id="loginForm">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username"
             placeholder="admin" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" placeholder="••••••••" required>
      <button class="btn" type="submit">Sign In</button>
    </form>
    <div class="error" id="err"></div>
  </div>
  <script>
    // Show error message from query param (server-side redirect on failure)
    const params = new URLSearchParams(window.location.search);
    if (params.get('error')) {
      document.getElementById('err').textContent = 'Invalid username or password.';
    }
  </script>
</body>
</html>
