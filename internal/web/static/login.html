<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · BeastDB Studio</title>
  <link rel="icon" type="image/svg+xml" href="/brand/beastdb-favicon.svg">
  <link rel="stylesheet" href="/css/theme.css">
  <script>try{var t=localStorage.getItem('beastdb-theme');document.documentElement.classList.toggle('dark',t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))}catch(e){}</script>
</head>
<body>
  <main class="login-shell">
    <div class="login-top"><div class="brand-logo" role="img" aria-label="BeastDB"><img class="brand-logo-light" src="/brand/beastdb-horizontal-light.svg" alt=""><img class="brand-logo-dark" src="/brand/beastdb-horizontal-dark.svg" alt=""></div><button id="theme" type="button" class="theme-button" aria-label="Toggle color theme">◐</button></div>
    <section class="login-card" aria-labelledby="login-title">
      <p class="eyebrow">DATABASE CONSOLE</p>
      <h1 id="login-title">Welcome back</h1>
      <p class="intro">Sign in to explore records and manage your database.</p>
      <form id="login-form" method="post" action="/login">
        <label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus placeholder="Enter your username">
        <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password">
        <p id="error" role="alert" class="error" hidden>Sign in failed. Check your credentials and try again.</p>
        <button id="submit" class="submit" type="submit">Sign in</button>
      </form>
    </section>
    <p class="footer">BeastDB Studio · Secure database access</p>
  </main>
  <script>
    document.getElementById('theme').addEventListener('click', function () {
      var dark = !document.documentElement.classList.contains('dark');
      document.documentElement.classList.toggle('dark', dark);
      localStorage.setItem('beastdb-theme', dark ? 'dark' : 'light');
    });
    document.getElementById('login-form').addEventListener('submit', async function (event) {
      event.preventDefault();
      var button = document.getElementById('submit');
      var error = document.getElementById('error');
      button.disabled = true; button.textContent = 'Signing in…'; error.hidden = true;
      try {
        var form = event.currentTarget;
        var data = { username: form.username.value, password: form.password.value };
        var response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
          credentials: 'same-origin'
        });
        if (!response.ok) throw new Error('Sign in failed');
        window.location.assign('/');
      } catch (e) { error.hidden = false; button.disabled = false; button.textContent = 'Sign in'; }
    });
  </script>
</body>
</html>
