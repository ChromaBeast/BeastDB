<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeastDB — Studio Login</title>
  <link rel="stylesheet" href="/css/theme.css">
  <style>
    .login-container {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .login-card {
      width: 100%; max-width: 400px; background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(20px); border: 1px solid var(--border);
      border-radius: 16px; padding: 2.5rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px -10px var(--primary-glow);
    }
    .login-brand { text-align: center; margin-bottom: 2rem; }
    .login-title { font-size: 1.8rem; font-weight: 800; color: var(--primary); letter-spacing: -0.03em; }
    .login-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.35rem; }
    .login-error {
      background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5; font-size: 0.8rem; padding: 0.6rem; border-radius: 8px;
      margin-bottom: 1rem; text-align: center; display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-title">⚡ BeastDB Studio</div>
        <div class="login-sub">High-Performance Database Engine Console</div>
      </div>

      <div id="errMsg" class="login-error">Invalid username or password.</div>

      <form method="POST" action="/login">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="input-control" id="username" name="username" type="text"
                 placeholder="admin" autocomplete="username" required autofocus>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label class="form-label" for="password">Password</label>
          <input class="input-control" id="password" name="password" type="password"
                 placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <button class="btn btn-primary" style="width: 100%; padding: 0.75rem;" type="submit">
          Sign In to Studio
        </button>
      </form>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get("error")) {
      document.getElementById("errMsg").style.display = "block";
    }
  </script>
</body>
</html>
