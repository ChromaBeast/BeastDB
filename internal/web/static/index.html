<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeastDB — Studio</title>
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="brand">
      <span class="brand-logo">⚡ BeastDB</span>
      <span class="badge badge-green"><span class="badge-dot"></span> <span id="statRole">Leader</span></span>
      <span class="badge badge-purple">Node #1</span>
    </div>
    <div style="display: flex; align-items: center; gap: 1rem;">
      <span style="font-size: 0.85rem; color: var(--text-muted);">User: <strong style="color: var(--text-main);">admin</strong></span>
      <form method="POST" action="/logout" style="margin: 0;">
        <button class="btn btn-ghost" type="submit" style="padding: 0.4rem 0.85rem; font-size: 0.8rem;">Sign Out</button>
      </form>
    </div>
  </header>

  <main style="max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem;">
    <!-- Live Telemetry HUD -->
    <section class="hud-grid">
      <div class="hud-card">
        <div class="hud-title">WAL Log Sequence Number</div>
        <div class="hud-val mono" id="statLsn" style="color: var(--accent-cyan);">#0</div>
      </div>
      <div class="hud-card">
        <div class="hud-title">Index Engine</div>
        <div class="hud-val" id="statMode">B+ Tree (4KB)</div>
      </div>
      <div class="hud-card">
        <div class="hud-title">Storage Durability</div>
        <div class="hud-val" style="color: var(--success);">ARIES / WAL</div>
      </div>
      <div class="hud-card">
        <div class="hud-title">Engine Concurrency</div>
        <div class="hud-val mono">RWMutex</div>
      </div>
    </section>

    <!-- Studio Operations Layout -->
    <section class="studio-layout">
      <!-- Left: Key Query & Mutation Panel -->
      <div class="card">
        <div class="card-title">
          <span>Key Operations</span>
        </div>

        <!-- Quick Point Query -->
        <div class="form-group">
          <label class="form-label" for="searchKey">Lookup by Key (uint64)</label>
          <div style="display: flex; gap: 0.5rem;">
            <input class="input-control mono" id="searchKey" type="number" placeholder="e.g. 1001" min="0">
            <button class="btn btn-primary" onclick="executeGet()">Find</button>
            <button class="btn btn-danger" onclick="executeDelete()">Delete</button>
          </div>
        </div>

        <hr style="border: none; border-top: 1px solid var(--border); margin: 1.25rem 0;">

        <!-- Insert / Update Tuple -->
        <div class="card-title" style="margin-bottom: 0.75rem;">
          <span>Insert / Update Record</span>
          <button class="btn btn-ghost" style="padding: 0.25rem 0.6rem; font-size: 0.75rem;" onclick="formatJsonInput()">Format JSON</button>
        </div>

        <div class="form-group">
          <label class="form-label" for="mutationKey">Key (uint64)</label>
          <input class="input-control mono" id="mutationKey" type="number" placeholder="e.g. 1001" min="0">
        </div>

        <div class="form-group">
          <label class="form-label" for="mutationVal">Payload (JSON or text)</label>
          <textarea class="input-control mono" id="mutationVal" placeholder='{"title": "Half-Life 2", "status": "completed"}'></textarea>
        </div>

        <button class="btn btn-primary" style="margin-top: 0.5rem;" onclick="executePut()">
          Commit to B+ Tree & WAL
        </button>
      </div>

      <!-- Right: Record Inspector -->
      <div class="card">
        <div class="card-title">
          <span>Record Inspector</span>
          <button class="btn btn-ghost" style="padding: 0.25rem 0.6rem; font-size: 0.75rem;" onclick="copyInspector()">Copy</button>
        </div>
        <pre class="code-viewer mono" id="recordInspector">// Select or insert a key to inspect its stored payload...</pre>
      </div>
    </section>
  </main>

  <!-- Toast Notification Anchor -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/dashboard.js"></script>
</body>
</html>
