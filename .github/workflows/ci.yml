name: BeastDB CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  engine-test:
    name: Engine Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Go Vet
        run: go vet ./...

      # -p 1 runs one package at a time. TestEngineSystemWorkloadBenchmark has a
      # fixed throughput floor and is fsync-bound; on Windows runners, packages
      # fsyncing in parallel cut it to ~320 ops/s (vs ~1700 with -p 1).
      - name: Run Go Tests (Uncached)
        run: go test -v -count=1 -p 1 ./...

      - name: Run Race Detector (Linux)
        if: runner.os == 'Linux'
        run: go test -v -race -count=1 -p 1 ./...

  studio-test:
    name: Studio Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./studio

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Studio Tests
        run: bun test

      - name: Build Studio Static Assets
        run: bun run build
